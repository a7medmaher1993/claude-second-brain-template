name: Link check

# Weekly automated check for broken external links in the docs.
# MCP URLs drift; this catches dead ones before users hit them.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays at 09:00 UTC
  workflow_dispatch:       # also runs on manual trigger
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/link-check.yml'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,403,429
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https?://[^/]*\.(slack|granola|notion|asana|github|figma|atlassian|linear|hubspot|stripe|sentry|datadog|posthog|amplitude|mixpanel|statsig|attio|close|intercom|tavily|exa|firecrawl|perplexity|krisp|grain|sembly|avoma|otter|fireflies|fastmail|dropbox|cloudflare)\.(com|app|ai|io|dev|ru|net)/mcp'
            './README.md'
            './docs/**/*.md'
          fail: false   # surface broken links as a notice; don't break the workflow

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('./lychee/out.md')) {
              const body = fs.readFileSync('./lychee/out.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Link check results\n\n' + body
              });
            }

# Notes:
# - We exclude MCP server endpoints from the check because most require
#   OAuth and return non-200 codes to unauthenticated probes — not actually
#   broken, just gated.
# - `fail: false` means broken links surface as a workflow notice but don't
#   block PRs. Triage manually.
